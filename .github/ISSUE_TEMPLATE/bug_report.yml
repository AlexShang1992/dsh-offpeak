name: Bug report
description: Report a reproducible problem with dsh-offpeak
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in as much as you can — a good
        reproduction is the fastest way to a fix.
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Version of dsh-offpeak (from Settings → Plugins, or `package.json`).
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version & profile
      description: Output of `dsh --version` (or the `@deepseek-ai/dsh` version) and the profile name.
      placeholder: e.g. 0.1.0, profile web
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where are you running DSH?
      options:
        - macOS
        - Linux
        - Windows
        - WSL
        - Other
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: e.g. 24.4.0
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do? Include exact commands (e.g. `/defer foo`) and what the UI showed.
      placeholder: |
        1. Install dsh-offpeak
        2. Run /offpeak
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, console output, or screenshots.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I reproduced with the latest release
          required: true
