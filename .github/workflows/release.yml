name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
          package-name: dsh-offpeak

  attach-tarball:
    name: attach the install tarball
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the full gate
        run: pnpm run check

      # The published install path. A `github:` dependency would have to build
      # itself through the `prepare` script, and pnpm 10 refuses to run a
      # dependency's lifecycle scripts unless the consumer allowlists it — so
      # the release carries a packed tarball that needs no build step. The
      # name is fixed so /releases/latest/download/dsh-offpeak.tgz resolves.
      - name: Pack
        run: |
          npm pack --silent
          mv dsh-offpeak-*.tgz dsh-offpeak.tgz

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.release-please.outputs.version }}" dsh-offpeak.tgz --clobber

  publish:
    name: publish to npm
    needs: release-please
    # Publishing is opt-in. Turn it on by adding the NPM_TOKEN secret and
    # setting the repository variable PUBLISH_TO_NPM to "true"; until then a
    # release is tagged and published on GitHub only, and this job is skipped
    # instead of failing on a missing token.
    if: ${{ needs.release-please.outputs.release_created && vars.PUBLISH_TO_NPM == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the full gate
        run: pnpm run check

      - name: Publish (provenance)
        run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
